<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Custom Truck</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="#222222" x="0" y="0" width="200" height="200" rx="8"></rect>
        <!-- Truck body -->
        <path d="M30,120 L50,80 L120,80 L140,110 L170,110 L170,130 L140,130 L140,140 L30,140 L30,120 Z" fill="#cc0000" stroke="#000000" stroke-width="2"></path>
        <!-- Windshield -->
        <path d="M50,80 L70,60 L120,60 L120,80 L50,80 Z" fill="#99CCFF" stroke="#000000" stroke-width="2"></path>
        <!-- Wheels -->
        <circle cx="50" cy="140" r="15" fill="#333333" stroke="#000000" stroke-width="2"></circle>
        <circle cx="50" cy="140" r="7" fill="#666666" stroke="#000000" stroke-width="1"></circle>
        <circle cx="120" cy="140" r="15" fill="#333333" stroke="#000000" stroke-width="2"></circle>
        <circle cx="120" cy="140" r="7" fill="#666666" stroke="#000000" stroke-width="1"></circle>
        <circle cx="160" cy="130" r="12" fill="#333333" stroke="#000000" stroke-width="2"></circle>
        <circle cx="160" cy="130" r="6" fill="#666666" stroke="#000000" stroke-width="1"></circle>
        <!-- Flames -->
        <path d="M35,120 C40,110 45,115 50,110 C55,105 60,120 65,115 C70,110 75,120 75,120 L35,120 Z" fill="#F5A623" stroke="#E67E00" stroke-width="1"></path>
        <!-- Counts Kustoms text -->
        <text font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">
            <tspan x="45" y="95">COUNTS KUSTOMS</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#f5a623">
            <tspan x="50" y="175">CUSTOM TRUCK</tspan>
        </text>
    </g>
</svg>