<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CD7F32" />
      <stop offset="100%" stop-color="#A0522D" />
    </linearGradient>
  </defs>
  
  <!-- Box base -->
  <rect x="15" y="40" width="70" height="55" rx="5" fill="url(#bronzeGradient)" />
  
  <!-- Box lid -->
  <rect x="10" y="30" width="80" height="15" rx="3" fill="#D2691E" />
  
  <!-- Ribbon vertical -->
  <rect x="45" y="5" width="10" height="90" fill="#FFDF00" />
  
  <!-- Ribbon horizontal -->
  <rect x="15" y="40" width="70" height="10" fill="#FFDF00" />
  
  <!-- Ribbon bow left -->
  <path d="M45,15 Q35,5 30,15 Q25,25 35,25 Q45,25 45,15" fill="#FFDF00" />
  
  <!-- Ribbon bow right -->
  <path d="M55,15 Q65,5 70,15 Q75,25 65,25 Q55,25 55,15" fill="#FFDF00" />
  
  <!-- Pepe symbol -->
  <text x="50" y="75" font-family="Arial" font-size="20" font-weight="bold" fill="#2D2D2D" text-anchor="middle">PEPE</text>
</svg>
