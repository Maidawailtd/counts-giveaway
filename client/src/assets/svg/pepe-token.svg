<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tokenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ABE42" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>
  
  <!-- Token background -->
  <circle cx="50" cy="50" r="45" fill="url(#tokenGradient)" />
  <circle cx="50" cy="50" r="40" fill="#2D2D2D" />
  
  <!-- Pepe face on token -->
  <g transform="translate(30, 30) scale(0.6)">
    <ellipse cx="30" cy="35" rx="30" ry="35" fill="#5ABE42" />
    <!-- Eyes -->
    <ellipse cx="20" cy="25" rx="7" ry="10" fill="#FFF" />
    <ellipse cx="40" cy="25" rx="7" ry="10" fill="#FFF" />
    <circle cx="20" cy="27" r="4" fill="#000" />
    <circle cx="40" cy="27" r="4" fill="#000" />
    <!-- Mouth -->
    <path d="M15,45 Q30,55 45,45" fill="none" stroke="#2D2D2D" stroke-width="2" />
  </g>
  
  <!-- Dollar symbol -->
  <text x="35" y="37" font-family="Arial" font-size="15" fill="#FFD700" font-weight="bold">$PEPE</text>
  
  <!-- Token edge details -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,2" />
</svg>
