<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="customGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC0000" />
      <stop offset="25%" stop-color="#990000" />
      <stop offset="50%" stop-color="#CC0000" />
      <stop offset="75%" stop-color="#990000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <linearGradient id="ribbonCustom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#444444" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <pattern id="checkerPattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#CC0000" />
      <rect x="5" y="5" width="5" height="5" fill="#CC0000" />
      <rect x="5" y="0" width="5" height="5" fill="#990000" />
      <rect x="0" y="5" width="5" height="5" fill="#990000" />
    </pattern>
  </defs>
  
  <!-- Box base -->
  <rect x="20" y="40" width="60" height="50" rx="3" fill="url(#customGradient)" stroke="#333333" stroke-width="1" />
  
  <!-- Box lid (top) -->
  <rect x="15" y="30" width="70" height="15" rx="3" fill="url(#customGradient)" stroke="#333333" stroke-width="1" />
  
  <!-- Custom pattern on box -->
  <rect x="25" y="45" width="50" height="40" rx="2" fill="url(#checkerPattern)" opacity="0.3" />
  
  <!-- Ribbon around box -->
  <rect x="20" y="55" width="60" height="10" fill="url(#ribbonCustom)" />
  <rect x="45" y="40" width="10" height="50" fill="url(#ribbonCustom)" />
  
  <!-- Ribbon bow -->
  <ellipse cx="50" cy="55" rx="12" ry="5" fill="url(#ribbonCustom)" stroke="#222222" stroke-width="0.5" />
  <ellipse cx="50" cy="55" rx="5" ry="12" fill="url(#ribbonCustom)" stroke="#222222" stroke-width="0.5" />
  
  <!-- Car silhouette decal -->
  <path d="M35,70 L40,60 L60,60 L65,70" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="40" cy="70" r="5" fill="#333333" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="60" cy="70" r="5" fill="#333333" stroke="#FFFFFF" stroke-width="1" />
  
  <!-- CUSTOM text -->
  <text x="50" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CUSTOM BOX</text>
</svg>