<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#888888" />
      <stop offset="50%" stop-color="#DDDDDD" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCCCCC" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CCCCCC" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCCCCC" />
    </linearGradient>
  </defs>
  
  <!-- Car part background -->
  <rect x="10" y="25" width="80" height="50" rx="10" fill="#333333" />
  
  <!-- Car wheel -->
  <circle cx="50" cy="50" r="20" fill="#111111" stroke="url(#metalGradient)" stroke-width="3" />
  <circle cx="50" cy="50" r="15" fill="#222222" stroke="url(#chromeGradient)" stroke-width="2" />
  <circle cx="50" cy="50" r="5" fill="url(#chromeGradient)" />
  
  <!-- Spokes -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="url(#chromeGradient)" stroke-width="2" />
  <line x1="30" y1="50" x2="70" y2="50" stroke="url(#chromeGradient)" stroke-width="2" />
  <line x1="37" y1="37" x2="63" y2="63" stroke="url(#chromeGradient)" stroke-width="2" />
  <line x1="37" y1="63" x2="63" y2="37" stroke="url(#chromeGradient)" stroke-width="2" />
  
  <!-- Label -->
  <text x="50" y="90" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CUSTOM CAR PART</text>
</svg>