<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tshirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
  </defs>
  
  <!-- T-shirt body -->
  <path d="M20,20 L40,10 L60,10 L80,20 L70,30 L70,80 L30,80 L30,30 Z" fill="url(#tshirtGradient)" />
  
  <!-- T-shirt collar -->
  <path d="M40,10 L50,20 L60,10" fill="none" stroke="#5ABE42" stroke-width="2" />
  
  <!-- T-shirt sleeves -->
  <path d="M30,30 L15,40" fill="none" stroke="#5ABE42" stroke-width="2" />
  <path d="M70,30 L85,40" fill="none" stroke="#5ABE42" stroke-width="2" />
  
  <!-- Pepe logo on shirt -->
  <g transform="translate(40, 35) scale(0.4)">
    <ellipse cx="30" cy="35" rx="30" ry="35" fill="#5ABE42" />
    <!-- Eyes -->
    <ellipse cx="20" cy="25" rx="7" ry="10" fill="#FFF" />
    <ellipse cx="40" cy="25" rx="7" ry="10" fill="#FFF" />
    <circle cx="20" cy="27" r="4" fill="#000" />
    <circle cx="40" cy="27" r="4" fill="#000" />
    <!-- Mouth -->
    <path d="M15,45 Q30,55 45,45" fill="none" stroke="#2D2D2D" stroke-width="2" />
  </g>
  
  <text x="50" y="70" font-family="Arial" font-size="12" font-weight="bold" fill="#FFD700" text-anchor="middle">MILLONARIO</text>
</svg>
