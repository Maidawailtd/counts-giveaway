<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chromeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCCCCC" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CCCCCC" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCCCCC" />
    </linearGradient>
    <linearGradient id="chromeRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAAAAA" />
      <stop offset="50%" stop-color="#DDDDDD" />
      <stop offset="100%" stop-color="#AAAAAA" />
    </linearGradient>
  </defs>
  
  <!-- Box base -->
  <rect x="20" y="40" width="60" height="50" rx="3" fill="url(#chromeBg)" stroke="#444444" stroke-width="1" />
  
  <!-- Box lid (top) -->
  <rect x="15" y="30" width="70" height="15" rx="3" fill="url(#chromeBg)" stroke="#444444" stroke-width="1" />
  
  <!-- Ribbon around box -->
  <rect x="20" y="55" width="60" height="10" fill="url(#chromeRibbon)" />
  <rect x="45" y="40" width="10" height="50" fill="url(#chromeRibbon)" />
  
  <!-- Ribbon bow -->
  <ellipse cx="50" cy="55" rx="12" ry="5" fill="url(#chromeRibbon)" stroke="#888888" stroke-width="0.5" />
  <ellipse cx="50" cy="55" rx="5" ry="12" fill="url(#chromeRibbon)" stroke="#888888" stroke-width="0.5" />
  
  <!-- Shine effects -->
  <ellipse cx="35" cy="50" rx="5" ry="10" fill="#FFFFFF" opacity="0.2" />
  <ellipse cx="65" cy="70" rx="5" ry="10" fill="#FFFFFF" opacity="0.2" />
  
  <!-- CHROME text -->
  <text x="50" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">CHROME BOX</text>
</svg>