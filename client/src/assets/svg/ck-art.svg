<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="artGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FF3300" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
  </defs>
  
  <!-- Art frame -->
  <rect x="15" y="15" width="70" height="70" rx="2" fill="url(#frameGradient)" stroke="#666666" stroke-width="2" />
  
  <!-- Art canvas -->
  <rect x="20" y="20" width="60" height="60" fill="url(#artGradient)" />
  
  <!-- Custom artwork - flame design -->
  <path d="M30,80 Q40,50 50,70 Q60,40 70,80" fill="url(#flameGradient)" />
  
  <!-- Car silhouette in art -->
  <path d="M25,60 L35,60 L40,50 L60,50 L65,60 L75,60 L75,70 L25,70 Z" fill="none" stroke="#CCCCCC" stroke-width="1" />
  <circle cx="35" cy="70" r="5" fill="none" stroke="#CCCCCC" stroke-width="1" />
  <circle cx="65" cy="70" r="5" fill="none" stroke="#CCCCCC" stroke-width="1" />
  
  <!-- Art signature -->
  <text x="65" y="75" font-family="Arial" font-size="5" fill="#CCCCCC">CK Art</text>
  
  <!-- Label -->
  <text x="50" y="95" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CUSTOM ARTWORK</text>
</svg>