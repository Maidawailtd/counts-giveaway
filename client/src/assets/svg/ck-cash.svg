<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054D00" />
      <stop offset="100%" stop-color="#033000" />
    </linearGradient>
    <linearGradient id="cashShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77DD77" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#AAFFAA" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#77DD77" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  
  <!-- Dollar bill -->
  <rect x="10" y="30" width="80" height="40" rx="2" fill="url(#cashBg)" stroke="#333333" stroke-width="1" />
  
  <!-- Dollar bill border -->
  <rect x="12" y="32" width="76" height="36" rx="1" fill="none" stroke="#AAFFAA" stroke-width="0.5" stroke-dasharray="1,1" />
  
  <!-- Dollar bill center -->
  <rect x="25" y="40" width="50" height="20" rx="10" fill="url(#cashShine)" opacity="0.3" />
  
  <!-- Dollar sign -->
  <text x="50" y="57" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$</text>
  
  <!-- Value text -->
  <text x="50" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CASH PRIZE</text>
  
  <!-- Corner numbers -->
  <text x="15" y="40" font-family="Arial" font-size="6" fill="#FFFFFF">$$$</text>
  <text x="85" y="40" font-family="Arial" font-size="6" fill="#FFFFFF" text-anchor="end">$$$</text>
  <text x="15" y="65" font-family="Arial" font-size="6" fill="#FFFFFF">$$$</text>
  <text x="85" y="65" font-family="Arial" font-size="6" fill="#FFFFFF" text-anchor="end">$$$</text>
</svg>