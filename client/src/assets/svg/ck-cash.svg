<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003300" />
      <stop offset="100%" stop-color="#006600" />
    </linearGradient>
  </defs>
  
  <!-- Cash background -->
  <rect x="10" y="20" width="80" height="60" rx="5" fill="url(#cashGradient)" />
  
  <!-- Dollar emblem -->
  <circle cx="50" cy="50" r="20" fill="#006600" stroke="#003300" stroke-width="2" />
  <text x="50" y="58" font-family="Arial" font-size="30" font-weight="bold" fill="#DDDDDD" text-anchor="middle">$</text>
  
  <!-- Cash corners -->
  <circle cx="25" cy="35" r="10" fill="#004400" />
  <circle cx="75" cy="35" r="10" fill="#004400" />
  <circle cx="25" cy="65" r="10" fill="#004400" />
  <circle cx="75" cy="65" r="10" fill="#004400" />
  
  <!-- Value text -->
  <text x="50" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CASH PRIZE</text>
</svg>