<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ABE42" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#5ABE42" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="10" fill="url(#nftBg)" />
  
  <!-- NFT frame -->
  <rect x="10" y="10" width="80" height="80" rx="5" fill="#2D2D2D" stroke="#FFD700" stroke-width="3" />
  
  <!-- Pepe NFT -->
  <g transform="translate(20, 15)">
    <ellipse cx="30" cy="35" rx="30" ry="35" fill="#5ABE42" />
    <!-- Eyes -->
    <ellipse cx="20" cy="25" rx="7" ry="10" fill="#FFF" />
    <ellipse cx="40" cy="25" rx="7" ry="10" fill="#FFF" />
    <circle cx="20" cy="27" r="4" fill="#000" />
    <circle cx="40" cy="27" r="4" fill="#000" />
    <!-- Crown -->
    <path d="M15,15 L30,5 L45,15 L40,20 L20,20 Z" fill="#FFD700" />
    <!-- Mouth -->
    <path d="M15,45 Q30,55 45,45" fill="none" stroke="#2D2D2D" stroke-width="2" />
  </g>
  
  <!-- Rare Badge -->
  <circle cx="80" cy="20" r="12" fill="#FF6B6B" stroke="#FFD700" stroke-width="2" />
  <text x="80" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">RARE</text>
</svg>
