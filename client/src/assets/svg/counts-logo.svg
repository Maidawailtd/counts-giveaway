<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Red text -->
  <text x="10" y="60" font-family="Bebas Neue, sans-serif" font-size="60" fill="#CC0000" font-weight="bold">COUNTS</text>
  
  <!-- Gray text -->
  <text x="10" y="90" font-family="Bebas Neue, sans-serif" font-size="35" fill="#777777" font-weight="bold">KUSTOMS</text>
  
  <!-- Car silhouette emblem -->
  <g transform="translate(225, 50) scale(0.6)">
    <!-- Car body outline -->
    <path d="M0,30 L20,30 L30,10 L70,10 L80,30 L100,30 L95,50 L5,50 Z" fill="none" stroke="#CC0000" stroke-width="4" />
    
    <!-- Wheels -->
    <circle cx="25" cy="50" r="10" fill="#333333" stroke="#777777" stroke-width="2" />
    <circle cx="75" cy="50" r="10" fill="#333333" stroke="#777777" stroke-width="2" />
    
    <!-- Windows -->
    <path d="M30,10 L70,10 L65,25 L35,25 Z" fill="none" stroke="#CC0000" stroke-width="2" />
  </g>
</svg>