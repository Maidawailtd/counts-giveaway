<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flamesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="50%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
    <linearGradient id="flamesTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>
  
  <!-- Box base -->
  <rect x="15" y="40" width="70" height="55" rx="5" fill="url(#flamesGradient)" />
  
  <!-- Box lid -->
  <rect x="10" y="30" width="80" height="15" rx="3" fill="url(#flamesTop)" />
  
  <!-- Flame patterns on box -->
  <path d="M15,50 Q25,35 25,45 Q30,30 35,40 Q40,30 45,45 Q50,30 55,40 Q60,30 65,45 Q70,30 75,40 Q80,30 85,50" fill="none" stroke="#FFCC00" stroke-width="2" />
  
  <!-- Ribbon vertical -->
  <rect x="45" y="5" width="10" height="90" fill="#FFCC00" />
  
  <!-- Ribbon horizontal -->
  <rect x="15" y="40" width="70" height="10" fill="#FFCC00" />
  
  <!-- Ribbon bow left -->
  <path d="M45,15 Q35,5 30,15 Q25,25 35,25 Q45,25 45,15" fill="#FFCC00" />
  
  <!-- Ribbon bow right -->
  <path d="M55,15 Q65,5 70,15 Q75,25 65,25 Q55,25 55,15" fill="#FFCC00" />
  
  <!-- CK symbol -->
  <text x="50" y="75" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CK</text>
</svg>