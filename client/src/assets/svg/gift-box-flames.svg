<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="25%" stop-color="#FF6600" />
      <stop offset="50%" stop-color="#FF3300" />
      <stop offset="75%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="boxBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="50%" stop-color="#333333" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3300" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
  </defs>
  
  <!-- Box base -->
  <rect x="20" y="40" width="60" height="50" rx="3" fill="url(#boxBlack)" stroke="#444444" stroke-width="1" />
  
  <!-- Box lid (top) -->
  <rect x="15" y="30" width="70" height="15" rx="3" fill="url(#boxBlack)" stroke="#444444" stroke-width="1" />
  
  <!-- Flame pattern on box -->
  <path d="M25,90 Q30,80 35,85 Q40,75 45,80 Q50,65 55,80 Q60,70 65,80 Q70,75 75,90" fill="url(#flameGradient)" />
  <path d="M25,40 Q30,30 35,35 Q40,25 45,30 Q50,20 55,30 Q60,25 65,30 Q70,25 75,40" fill="url(#flameGradient)" />
  
  <!-- Ribbon around box -->
  <rect x="20" y="55" width="60" height="10" fill="url(#ribbonGradient)" />
  <rect x="45" y="40" width="10" height="50" fill="url(#ribbonGradient)" />
  
  <!-- Ribbon bow -->
  <ellipse cx="50" cy="55" rx="12" ry="5" fill="url(#ribbonGradient)" stroke="#FF3300" stroke-width="0.5" />
  <ellipse cx="50" cy="55" rx="5" ry="12" fill="url(#ribbonGradient)" stroke="#FF3300" stroke-width="0.5" />
  
  <!-- Glow effect -->
  <rect x="25" y="45" width="50" height="40" rx="2" fill="url(#flameGradient)" opacity="0.1" />
  
  <!-- FLAMES text -->
  <text x="50" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#FF3300" text-anchor="middle">FLAMES BOX</text>
</svg>