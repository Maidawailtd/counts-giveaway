<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
  </defs>
  
  <!-- Floor -->
  <rect x="10" y="70" width="80" height="20" fill="url(#floorGradient)" />
  
  <!-- Walls -->
  <rect x="10" y="20" width="80" height="50" fill="#444444" />
  
  <!-- Road sign -->
  <rect x="65" y="35" width="20" height="15" fill="#CCCCCC" stroke="#000000" stroke-width="1" />
  <text x="75" y="46" font-family="Arial" font-size="8" fill="#000000" text-anchor="middle">SHOP</text>
  
  <!-- Car lift -->
  <rect x="15" y="40" width="40" height="5" fill="#CC0000" />
  <rect x="20" y="45" width="5" height="25" fill="#CC0000" />
  <rect x="45" y="45" width="5" height="25" fill="#CC0000" />
  
  <!-- Car silhouette -->
  <path d="M15,40 Q25,30 55,30 Q65,30 75,40" fill="none" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Tour text -->
  <text x="50" y="90" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SHOP TOUR</text>
</svg>